<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    <style>
        body {
            background-color: #e0f7fa; /* Soft light-blue background */
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            margin: 50px auto;
            padding: 20px;
            max-width: 400px;
        }
        .profile-photo {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin: 0 auto;
            display: block;
        }
        .button {
            display: inline-block;
            margin: 10px 0;
            padding: 10px 20px;
            color: white;
            background-color: #00796b;
            border: none;
            border-radius: 5px;
            text-decoration: none;
            font-size: 16px;
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #004d40;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="https://via.placeholder.com/80" alt="Profile Photo" class="profile-photo">
        <h1>Your Name</h1>
        <p>Welcome to my link page. You can find my latest works here!</p>
        <div>
            <a href="https://open.spotify.com" class="button">Spotify</a>
            <a href="https://bandcamp.com" class="button">Bandcamp</a>
            <a href="https://youtube.com" class="button">YouTube</a>
            <a href="https://mainwebsite.com" class="button">Main Website</a>
            <a href="https://jungleimmersionretreat.com" class="button">Jungle Immersion Retreat</a>
        </div>
    </div>
</body>
</html>
