<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Link in Bio</title>
    <style>
        body {
            background-color: #e0f7fa; /* Light blue background */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            text-align: center;
            width: 300px;
        }
        .profile-photo {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin-bottom: 15px;
        }
        .photo-area {
            width: 100%;
            height: 200px;
            background: url('https://link-to-your-spoify-preview-image') no-repeat center center;
            background-size: cover;
            margin-bottom: 15px;
            border-radius: 10px;
        }
        a {
            display: inline-block;
            margin: 10px 0;
            padding: 10px 15px;
            background-color: #42a5f5;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }
        a:hover {
            background-color: #2196f3;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="path/to/your/profile/photo.jpg" alt="Profile Photo" class="profile-photo">
        <div class="photo-area"></div>
        <a href="https://open.spotify.com/track/1hF1UTrEhEtsH3XCiAFsSn?si=b207306f717d4ba1">Listen on Spotify</a>
        <a href="https://yourbandcamp.link">Bandcamp</a>
        <a href="https://youtube.com/yourchannel">YouTube</a>
        <a href="https://yourwebsite.com">Main Website</a>
        <a href="https://jungleimmersionretreat.com">Jungle Immersion Retreat</a>
    </div>
</body>
</html>
